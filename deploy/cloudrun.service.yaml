apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: starter-api
spec:
  template:
    spec:
      containers:
        - image: us-docker.pkg.dev/PROJECT_ID/REPOSITORY/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: API_PREFIX
              value: /api
            - name: DATABASE_URL
              value: replace-with-secret-reference
